name: Deploy to production

on:
  push:
    branches:
      - master   # change to 'main' if your default branch is main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed if pushing with GITHUB_TOKEN; safe to keep

    steps:
      - uses: actions/checkout@v4

      # Ruby for Jekyll 3.8.x + your Gemfile
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7'
          bundler-cache: true

      # Python for sdg-build/scripts
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: make install

      - name: Build the site (production)
        run: make build.production

      - name: Deploy to GitHub Pages (production org)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          repository-name: PRODUCTION_ORGANISATION/PRODUCTION_ORGANISATION.github.io
          branch: gh-pages
          folder: _site
          clean: true
          token: ${{ secrets.PRODUCTION_PAGES_TOKEN }}
