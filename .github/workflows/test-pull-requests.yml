name: Test PRs

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7'
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: make install

      # ✅ Strong shim + correct here-doc (flush-left PY)
      - name: Inject pandas.io.json shim (sitecustomize.py)
        run: |
          cat > sitecustomize.py <<'PY'
          import sys, types, json, importlib
          try:
              # Ensure pandas.io is importable, then provide a real submodule
              importlib.import_module('pandas.io')
              m = types.ModuleType('pandas.io.json')
              m.dumps = json.dumps
              m.loads = json.loads
              sys.modules['pandas.io.json'] = m
              print("[shim] injected pandas.io.json with dumps/loads")
          except Exception as e:
              print("[shim] failed:", e)
          PY

      # ✅ Safer mass-replace; no indented here-doc, pipefail on
      - name: Patch all pandas.io.json usages
        run: |
          set -euo pipefail
          files=$(grep -RIlE 'pandas\.io\.json\.dumps|pd\.io\.json\.dumps|from pandas\.io import json' -- scripts || true)
          if [ -n "$files" ]; then
            for f in $files; do
              grep -qE '^[[:space:]]*import json(\s|$)' "$f" || sed -i '1i import json' "$f"
              sed -i -E 's/\b(pandas|pd)\.io\.json\.dumps/json.dumps/g' "$f"
              sed -i -E 's/\b(pandas|pd)\.io\.json\.loads/json.loads/g' "$f"
              sed -i -E 's/^from[[:space:]]+pandas\.io[[:space:]]+import[[:space:]]+json(\s+as\s+\w+)?/import json\1/' "$f"
            done
            echo "Patched: $files"
          else
            echo "No pandas.io.json usages found in repo files."
          fi

      - name: Patch build script to use stdlib json
        run: |
          sed -i '1i import json' scripts/build_data.py
          sed -i 's/pandas\.io\.json\.dumps/json.dumps/g' scripts/build_data.py

      - name: Test the site
        run: make test
