name: Deploy to staging

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # required for pushing to gh-pages

    steps:
      - uses: actions/checkout@v4

      # Ruby for Jekyll 3.8.x + your plugins
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7'
          bundler-cache: true

      # Python for sdg-build/scripts
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: make install

      - name: Inject pandas.io.json shim (sitecustomize.py)
        run: |
          cat > sitecustomize.py <<'PY'
          import json, types
          try:
              import pandas as pd
              setattr(pd.io, "json", types.SimpleNamespace(dumps=json.dumps, loads=json.loads))
          except Exception:
              pass
          PY
      
      - name: Patch all pandas.io.json usages
        run: |
          # (the mass-replace block from Option A)
          set -e
          files=$(git ls-files '*.py' | xargs grep -IlE 'pandas\.io\.json\.dumps|pd\.io\.json\.dumps|from pandas\.io import json' || true)
          if [ -n "$files" ]; then
            for f in $files; do
              grep -qE '^[[:space:]]*import json(\s|$)' "$f" || sed -i '1i import json' "$f"
              sed -i -E 's/\b(pandas|pd)\.io\.json\.dumps/json.dumps/g' "$f"
              sed -i -E 's/\b(pandas|pd)\.io\.json\.loads/json.loads/g' "$f"
              sed -i -E 's/^from[[:space:]]+pandas\.io[[:space:]]+import[[:space:]]+json(\s+as\s+\w+)?/import json\1/' "$f"
            done
            echo "Patched: $files"
          else
            echo "No pandas.io.json usages found in repo files."
          fi

      - name: Patch build script to use stdlib json
        run: |
          sed -i '1i import json' scripts/build_data.py
          sed -i 's/pandas\.io\.json\.dumps/json.dumps/g' scripts/build_data.py

      - name: Build the site
        run: make build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
