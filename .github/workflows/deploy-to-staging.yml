name: Deploy to staging

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # required for pushing to gh-pages

    steps:
      - uses: actions/checkout@v4

      # Ruby for Jekyll 3.8.x + your plugins
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7'
          bundler-cache: true

      # Python for sdg-build/scripts
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: make install

      - name: Build the site
        run: make build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
